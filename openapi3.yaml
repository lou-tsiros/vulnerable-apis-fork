            schema:
              $ref: '#/components/schemas/auth-login703259763'
            examples:
              Login Not email format:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login oem user who has not converted Hejhome-account:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Wrong password for oem user:
