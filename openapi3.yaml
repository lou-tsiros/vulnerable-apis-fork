                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Account is already blocked:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Not found account:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Wrong password:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Account is blocked:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login No deviceToken in request:
                value: |-
                  {
                    "deviceToken" : null,
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Login success:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Already converted OEM user:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "loginId",
                    "password" : "password",
                    "region" : "82"
                  }
              Login Input restricted email domain:
                value: |-
                  {
                    "deviceToken" : "deviceToken",
                    "deviceType" : "aos",
                    "email" : "temp@telm.net",
                    "password" : "password",
                    "region" : "82"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth-login785598133'
              examples:
                Login Not email format:
                  value: |-
                    {
                      "success" : false,
                      "message" : "Invalid input type.",
                      "code" : 1011,
                      "errorData" : null
                    }
                Login oem user who has not converted Hejhome-account:
                  value: |-
                    {
                      "success" : false,
                      "message" : "OEM account is already exists.",
                      "code" : 3015,
                      "errorData" : null
                    }
                Login Wrong password for oem user:
                  value: |-
                    {
                      "success" : false,
                      "message" : "Password is wrong in tuya.",
                      "code" : 3018,
                      "errorData" : null
                    }
                Login Account is already blocked:
                  value: |-
                    {
                      "success" : false,
                      "message" : "This Account is blocked.",
                      "code" : 3019,
                      "errorData" : {
                        "blockedUntil" : 1731000071685
