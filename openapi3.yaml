                    }
                Login Not found account:
                  value: |-
                    {
                      "success" : false,
                      "message" : "Not found account",
                      "code" : 1004,
                      "errorData" : null
                    }
                Login Wrong password:
                  value: |-
                    {
                      "success" : false,
                      "message" : "Password not match.",
                      "code" : 1006,
                      "errorData" : null
                    }
                Login Account is blocked:
                  value: |-
                    {
                      "success" : false,
                      "message" : "Account is blocked.",
                      "code" : 3020,
                      "errorData" : {
                        "blockedUntil" : 1731000071685
                      }
                    }
                Login No deviceToken in request:
                  value: |-
                    {
                      "success" : false,
                      "message" : "Invalid device token.",
                      "code" : 3003,
                      "errorData" : null
                    }
                Login Login success:
                  value: |-
                    {
                      "success" : true,
                      "result" : {
                        "jwtToken" : {
                          "accessToken" : "accessToken",
                          "refreshToken" : "refreshToken",
